# ──────────────────────────────────────────────────────────
#  Korf Rubik's Solver – docker-compose orchestration
#
#  Launch:  docker-compose up --build
#  Stop:    docker-compose down
#
#  Frontend → http://localhost:3000
#  Backend  → http://localhost:8001  (Swagger: /docs)
# ──────────────────────────────────────────────────────────

services:
  backend:
    build:
      context: ./app
      dockerfile: backend/Dockerfile
    ports:
      - "8001:8001"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/api/')"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

  frontend:
    build:
      context: ./app/frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
